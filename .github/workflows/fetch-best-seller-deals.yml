name: Update Best Seller Deals

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-best-seller-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests keepa numpy python-amazon-paapi

      - name: Run best seller scan
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          AFFILIATE_TAG: ${{ secrets.AMAZON_TAG }}
          CREATORS_CREDENTIAL_ID: ${{ secrets.CREATORS_CREDENTIAL_ID }}
          CREATORS_CREDENTIAL_SECRET: ${{ secrets.CREATORS_CREDENTIAL_SECRET }}
          BEST_SELLER_ASINS_PER_RUN: 125
          BEST_SELLER_REFRESH_WATCHLIST: false
        run: python fetch_best_seller_deals.py

      - name: Commit updated best seller data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add best_seller_categories.json fetch_best_seller_deals.py data/best_seller_deals.json || true
          git add data/best_seller_watchlist.json data/best_seller_state.json || true

          if git diff --cached --quiet; then
            echo "No best seller data changes to commit."
          else
            git commit -m "Update best seller dashboard data"
            git pull --rebase origin main
            git push
          fi
