name: Update Keepa Deals

on:
  # cron-job.org should trigger this workflow every 15 minutes.
  # GitHub's built-in schedule is intentionally disabled to avoid duplicate runs.
  workflow_dispatch:
  repository_dispatch:
    types: [creator-campaigns-updated]

permissions:
  contents: write

concurrency:
  group: keepa-rotating-price-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Keepa rotating scan
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          ASIN_CSV_URL: ${{ secrets.ASIN_CSV_URL }}
          MIN_DROP_PERCENT: 0
          SCAN_LIMIT: 105
          KEEPA_BATCH_SIZE: 25
          KEEPA_REQUEST_DELAY_SECONDS: 60
          KEEPA_RATE_LIMIT_WAIT_SECONDS: 70
          KEEPA_MAX_RETRIES: 5
          DEAL_TTL_HOURS: 24
          CREATOR_CONNECTIONS_MAX_FILES: 40
          CREATOR_CONNECTIONS_MAX_FILE_AGE_DAYS: 45
        run: python fetch_keepa_history_probe.py

      - name: Apply stronger deal qualification
        run: python filter_deals.py

      - name: Validate ASIN performance data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('data/asin_performance.json')
          if not path.exists() or path.stat().st_size == 0:
              raise SystemExit('data/asin_performance.json was not created or is empty')
          payload = json.loads(path.read_text(encoding='utf-8'))
          records = payload.get('asins', {}) if isinstance(payload, dict) else {}
          print(f"ASIN performance records: {len(records)}")
          if not records:
              raise SystemExit('data/asin_performance.json has no ASIN records')
          PY

      - name: Commit updated scan data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/deals.json data/deals_memory.json data/scan_state.json data/asin_performance.json

          if git diff --cached --quiet; then
            echo "No scan data changes to commit."
          else
            git commit -m "Update Keepa rotating scan data"
            git pull --rebase origin main
            git push
          fi
