name: Update CSV reminders

on:
  push:
    branches: [main]
    paths:
      - "data/creator-connections/**"

permissions:
  contents: write

concurrency:
  group: dashboard-csv-reminders
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - run: python update_csv_reminders.py
      - name: Commit reminder dates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/csv-reminders.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update CSV reminder dates"
          git pull --rebase origin main
          git push
