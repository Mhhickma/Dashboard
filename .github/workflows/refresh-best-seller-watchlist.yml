name: Refresh Best Seller Watchlist

on:
  schedule:
    - cron: "20 6 * * 0"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dashboard-best-seller-scan
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install keepa numpy python-amazon-paapi

      - name: Refresh best seller ASIN watchlist
        env:
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          BEST_SELLER_REFRESH_WATCHLIST: true
          BEST_SELLER_WATCHLIST_ONLY: true
        run: python fetch_best_seller_deals.py

      - name: Commit refreshed watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add best_seller_categories.json fetch_best_seller_deals.py || true
          git add data/best_seller_watchlist.json || true

          if git diff --cached --quiet; then
            echo "No best seller watchlist changes to commit."
          else
            git commit -m "Refresh best seller dashboard watchlist"
            git pull --rebase origin main
            git push
          fi
